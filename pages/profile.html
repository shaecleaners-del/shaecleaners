<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil Saya | Shae Cleaners</title>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="profile.css">
<style>
/*=====================================
PROFILE.CSS
Shae Cleaners Premium
=====================================*/

:root{

--primary:#0D6EFD;
--secondary:#38BDF8;
--success:#22C55E;
--danger:#EF4444;

--bg:#F5F8FC;
--white:#FFFFFF;
--text:#1E293B;
--grey:#64748B;

--radius:22px;
--shadow:0 10px 25px rgba(0,0,0,.08);

}

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;

}

body{

background:var(--bg);
color:var(--text);
padding-bottom:100px;

}

/*=========================
HEADER
=========================*/

.profile-header{

position:sticky;
top:0;

display:flex;
align-items:center;
gap:15px;

padding:18px 20px;

background:linear-gradient(135deg,#0D6EFD,#38BDF8);

color:#fff;

z-index:999;

box-shadow:0 5px 15px rgba(0,0,0,.15);

}

.profile-header h2{

font-size:22px;
font-weight:700;

}

.back-btn{

width:42px;
height:42px;

display:flex;
justify-content:center;
align-items:center;

background:rgba(255,255,255,.18);

border-radius:50%;

color:#fff;
text-decoration:none;

transition:.3s;

}

.back-btn:hover{

transform:scale(1.08);

}

/*=========================
PROFILE TOP
=========================*/

.profile-top{

text-align:center;

padding:35px 20px;

}

.photo-box{

position:relative;

width:130px;
height:130px;

margin:auto;

}

.photo-box img{

width:100%;
height:100%;

border-radius:50%;

object-fit:cover;

border:5px solid #fff;

box-shadow:var(--shadow);

background:#fff;

}

.camera{

position:absolute;

right:0;
bottom:0;

width:42px;
height:42px;

background:var(--primary);

border-radius:50%;

display:flex;
justify-content:center;
align-items:center;

color:#fff;

cursor:pointer;

box-shadow:var(--shadow);

}

.profile-top h2{

margin-top:18px;

font-size:25px;

}

.profile-top p{

margin-top:6px;

color:var(--grey);

}

/*=========================
FORM
=========================*/

.profile-form{

width:92%;

margin:25px auto;

background:#fff;

padding:25px;

border-radius:22px;

box-shadow:var(--shadow);

}

.profile-form h3{

margin-bottom:20px;

font-size:20px;

}

.form-group{

display:flex;

flex-direction:column;

margin-bottom:18px;

}

.form-group label{

margin-bottom:8px;

font-weight:600;

color:var(--text);

}

.form-group input,
.form-group textarea{

padding:15px;

border:1px solid #E2E8F0;

border-radius:14px;

font-size:15px;

outline:none;

transition:.3s;

background:#FAFBFD;

}

.form-group input:focus,
.form-group textarea:focus{

border-color:var(--primary);

box-shadow:0 0 0 3px rgba(13,110,253,.15);

}
/*=====================================
BUTTON SIMPAN
=====================================*/

.save-btn{

width:100%;

padding:16px;

border:none;

border-radius:16px;

background:linear-gradient(135deg,#0D6EFD,#38BDF8);

color:#fff;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.3s;

box-shadow:var(--shadow);

}

.save-btn:hover{

transform:translateY(-3px);

box-shadow:0 15px 30px rgba(13,110,253,.25);

}

/*=====================================
INFO AKUN
=====================================*/

.info-item{

display:flex;

justify-content:space-between;

align-items:center;

padding:16px 0;

border-bottom:1px solid #E5E7EB;

}

.info-item:last-child{

border-bottom:none;

}

.info-item span{

color:var(--grey);

font-size:15px;

}

.info-item strong{

color:var(--text);

font-weight:700;

}

/*=====================================
WHATSAPP BUTTON
=====================================*/

a.save-btn{

display:flex;

justify-content:center;

align-items:center;

gap:10px;

text-decoration:none;

}

a.save-btn i{

font-size:18px;

}

/*=====================================
DELETE BUTTON
=====================================*/

#deleteAccount{

background:linear-gradient(135deg,#DC2626,#EF4444);

}

#deleteAccount:hover{

box-shadow:0 15px 30px rgba(220,38,38,.25);

}

/*=====================================
BOTTOM NAVIGATION
=====================================*/

.bottom-nav{

position:fixed;

bottom:0;

left:0;

width:100%;

background:#fff;

display:flex;

justify-content:space-around;

align-items:center;

padding:10px 0;

box-shadow:0 -5px 20px rgba(0,0,0,.08);

z-index:999;

}

.bottom-nav a{

display:flex;

flex-direction:column;

align-items:center;

text-decoration:none;

color:#64748B;

font-size:12px;

transition:.3s;

}

.bottom-nav a i{

font-size:22px;

margin-bottom:5px;

}

.bottom-nav a.active{

color:var(--primary);

}

.bottom-nav a.active i{

transform:scale(1.1);

}

/*=====================================
ANIMASI
=====================================*/

@keyframes fadeUp{

0%{

opacity:0;

transform:translateY(30px);

}

100%{

opacity:1;

transform:translateY(0);

}

}

.profile-top,
.profile-form{

animation:fadeUp .7s ease;

}

/*=====================================
RESPONSIVE TABLET
=====================================*/

@media(max-width:768px){

.profile-form{

width:95%;

padding:20px;

}

.profile-top{

padding:30px 15px;

}

.photo-box{

width:110px;

height:110px;

}

}

/*=====================================
RESPONSIVE HP
=====================================*/

@media(max-width:480px){

.profile-header{

padding:16px;

}

.profile-header h2{

font-size:20px;

}

.profile-top h2{

font-size:22px;

}

.profile-form{

padding:18px;

}

.form-group input,
.form-group textarea{

font-size:14px;

padding:14px;

}

.save-btn{

font-size:15px;

padding:15px;

}

.bottom-nav a span{

font-size:11px;

}

}

/*=====================================
SCROLLBAR
=====================================*/

::-webkit-scrollbar{

width:6px;

}

::-webkit-scrollbar-thumb{

background:var(--primary);

border-radius:20px;

}

::-webkit-scrollbar-track{

background:#F1F5F9;

}</style>
</head>
<body>
<header class="profile-header">
<a href="/pages/akun.html" class="back-btn">
<i class="fa-solid fa-arrow-left"></i>
</a>
<h2>Profil Saya</h2>

</header>

<!-- FOTO PROFIL -->

<section class="profile-top">

<div class="photo-box">

<img src="/assets/profile.png"
id="previewPhoto"
alt="Profile">

<label for="photoInput" class="camera">

<i class="fa-solid fa-camera"></i>

</label>

<input
type="file"
id="photoInput"
accept="image/*"
hidden>

</div>

<h2 id="displayName">

Pelanggan

</h2>

<p id="displayEmail">

email@gmail.com

</p>

</section>

<!-- FORM -->

<section class="profile-form">

<div class="form-group">

<label>Nama Lengkap</label>

<input
type="text"
id="nama">

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
id="email"
readonly>

</div>

<div class="form-group">

<label>Nomor WhatsApp</label>

<input
type="tel"
id="phone"
placeholder="08xxxxxxxxxx">

</div>

<div class="form-group">

<label>Alamat</label>

<textarea
id="alamat"
rows="4"></textarea>

</div>

<div class="form-group">

<label>Kota</label>

<input
type="text"
id="kota">

</div>

<div class="form-group">

<label>Kode Pos</label>

<input
type="number"
id="kodepos">

</div>

<button
id="saveProfile"
class="save-btn">

<i class="fa-solid fa-floppy-disk"></i>

Simpan Perubahan

</button>

</section>
<!-- ================= KEAMANAN ================= -->

<section class="profile-form">

<h3>Keamanan Akun</h3>

<div class="form-group">

<label>Password Baru</label>

<input
type="password"
id="newPassword"
placeholder="Masukkan password baru">

</div>

<div class="form-group">

<label>Konfirmasi Password</label>

<input
type="password"
id="confirmPassword"
placeholder="Ulangi password baru">

</div>

<button
id="changePassword"
class="save-btn">

<i class="fa-solid fa-lock"></i>

Ubah Password

</button>

</section>

<!-- ================= INFORMASI AKUN ================= -->

<section class="profile-form">

<h3>Informasi Akun</h3>

<div class="info-item">

<span>Status Akun</span>

<strong id="accountStatus">

Aktif

</strong>

</div>

<div class="info-item">

<span>Member Sejak</span>

<strong id="memberSince">

-

</strong>

</div>

<div class="info-item">

<span>Total Order</span>

<strong id="profileOrder">

0

</strong>

</div>

</section>

<!-- ================= CUSTOMER SERVICE ================= -->

<section class="profile-form">

<h3>Bantuan</h3>

<a href="https://wa.me/message/MJ7SUIASE3DYN1"

class="save-btn"

style="text-decoration:none;display:block;text-align:center;background:#25D366;">

<i class="fa-brands fa-whatsapp"></i>

Hubungi Customer Service

</a>

</section>

<!-- ================= HAPUS AKUN ================= -->

<section class="profile-form">

<button

id="deleteAccount"

class="save-btn"

style="background:#dc2626;">

<i class="fa-solid fa-trash"></i>

Hapus Akun

</button>

</section>

<!-- ================= BOTTOM NAVIGATION ================= -->

<nav class="bottom-nav">

<a href="index.html">

<i class="fa-solid fa-house"></i>

<span>Beranda</span>

</a>

<a href="/chat-admin.html">

<i class="fa-solid fa-tags"></i>

<span>chat admin</span>

</a>

<a href="/pages/order.html">

<i class="fa-solid fa-cart-shopping"></i>

<span>Order</span>

</a>

<a href="/pages/tracking.html">

<i class="fa-solid fa-truck-fast"></i>

<span>Tracking</span>

</a>

<a href="/pages/akun.html" class="active">

<i class="fa-solid fa-user"></i>

<span>Akun</span>

</a>

</nav>

<script type="module" src="firebase.js"></script>
<script src="profile.js"></script>
<script>
/*=========================================
PROFILE.JS
Shae Cleaners
=========================================*/
import {
getStorage,
ref,
uploadBytes,
getDownloadURL

} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-storage.js";

const storage = getStorage();
/*=========================================
UPLOAD FOTO KE FIREBASE STORAGE
=========================================*/

photoInput.addEventListener("change", async (e) => {

const file = e.target.files[0];

if (!file || !currentUser) return;

try {

const storageRef = ref(
storage,
`profile/${currentUser.uid}`
);

await uploadBytes(storageRef, file);

const url = await getDownloadURL(storageRef);

await updateProfile(currentUser, {

photoURL: url

});

await setDoc(

doc(db, "users", currentUser.uid),

{

photoURL: url

},

{

merge: true

}

);

previewPhoto.src = url;

alert("Foto profil berhasil diperbarui.");

} catch (err) {

alert(err.message);

}

});

import { auth, db } from "./firebase.js";

import {
    onAuthStateChanged,
    updateProfile,
    updatePassword
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

import {
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";


const previewPhoto = document.getElementById("previewPhoto");
const displayName = document.getElementById("displayName");
const displayEmail = document.getElementById("displayEmail");

const nama = document.getElementById("nama");
const email = document.getElementById("email");
const phone = document.getElementById("phone");
const alamat = document.getElementById("alamat");
const kota = document.getElementById("kota");
const kodepos = document.getElementById("kodepos");

const saveProfile = document.getElementById("saveProfile");

let currentUser = null;


/*==========================
LOAD USER
==========================*/

onAuthStateChanged(auth, async(user)=>{

    if(!user){

        window.location.href="login.html";
        return;

    }
    currentUser = user;

    displayName.textContent =
    user.displayName || "Pelanggan";

    displayEmail.textContent =
    user.email;

    nama.value =
    user.displayName || "";

    email.value =
    user.email;

    if(user.photoURL){

        previewPhoto.src =
        user.photoURL;

    }

    try{

        const ref =
        doc(db,"users",user.uid);

        const snap =
        await getDoc(ref);

        if(snap.exists()){

            const data =
            snap.data();

            phone.value =
            data.phone || "";

            alamat.value =
            data.alamat || "";

            kota.value =
            data.kota || "";

            kodepos.value =
            data.kodepos || "";

            document.getElementById("profileOrder").textContent =
            data.totalOrder || 0;

        }

    }catch(err){

        console.log(err);

    }

});


/*==========================
SIMPAN PROFIL
==========================*/

saveProfile.addEventListener("click",async()=>{

    if(!currentUser) return;

    try{

        await updateProfile(currentUser,{

            displayName:nama.value

        });

        await setDoc(

            doc(db,"users",currentUser.uid),

            {

                nama:nama.value,

                phone:phone.value,

                alamat:alamat.value,

                kota:kota.value,

                kodepos:kodepos.value

            },

            {merge:true}

        );

        alert("Profil berhasil diperbarui.");

        displayName.textContent =
        nama.value;

    }catch(err){

        alert(err.message);

    }

});
/*=========================================
UPLOAD FOTO (Preview)
=========================================*/

const photoInput = document.getElementById("photoInput");

if(photoInput){

photoInput.addEventListener("change",(e)=>{

const file = e.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(event){

previewPhoto.src = event.target.result;

};

reader.readAsDataURL(file);

});

}


/*=========================================
UBAH PASSWORD
=========================================*/

const changePassword =
document.getElementById("changePassword");

if(changePassword){

changePassword.addEventListener("click",async()=>{

const newPassword =
document.getElementById("newPassword").value;

const confirmPassword =
document.getElementById("confirmPassword").value;

if(newPassword.length < 6){

alert("Password minimal 6 karakter.");

return;

}

if(newPassword !== confirmPassword){

alert("Konfirmasi password tidak sama.");

return;

}

try{

await updatePassword(currentUser,newPassword);

alert("Password berhasil diperbarui.");

document.getElementById("newPassword").value="";
document.getElementById("confirmPassword").value="";

}catch(err){

alert(err.message);

}

});

}


/*=========================================
STATUS AKUN
=========================================*/

if(currentUser){

document.getElementById("accountStatus").textContent="Aktif";

}

const today=new Date();

document.getElementById("memberSince").textContent=
today.getFullYear();


/*=========================================
HAPUS AKUN
=========================================*/

const deleteAccount =
document.getElementById("deleteAccount");

if(deleteAccount){

deleteAccount.addEventListener("click",async()=>{

const ok=confirm(
"Yakin ingin menghapus akun?"
);

if(!ok) return;

try{

await currentUser.delete();

alert("Akun berhasil dihapus.");

window.location.href="register.html";

}catch(err){

alert(err.message);

}

});

}


/*=========================================
ANIMASI INPUT
=========================================*/

document
.querySelectorAll("input, textarea")
.forEach((el)=>{

el.addEventListener("focus",()=>{

el.style.transform="scale(1.02)";

});

el.addEventListener("blur",()=>{

el.style.transform="scale(1)";

});

});


/*=========================================
AUTO REFRESH NAMA
=========================================*/

if(currentUser){

displayName.textContent =
currentUser.displayName || "Pelanggan";

}</script>
</body>
</html>
