/*======================================
ADMIN CHAT.CSS
Shae Cleaners Premium
======================================*/

:root{

--primary:#0D6EFD;
--secondary:#38BDF8;
--success:#22C55E;
--danger:#EF4444;

--bg:#F4F8FC;
--white:#FFFFFF;
--text:#1E293B;
--grey:#64748B;

--shadow:0 10px 25px rgba(0,0,0,.08);

}

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;

}

body{

background:var(--bg);
height:100vh;
overflow:hidden;

}

/*=========================
LAYOUT
=========================*/

.chat-layout{

display:grid;
grid-template-columns:340px 1fr;
height:100vh;

}

/*=========================
SIDEBAR
=========================*/

.sidebar{

background:#fff;
border-right:1px solid #E5E7EB;
display:flex;
flex-direction:column;

}

.sidebar-header{

padding:25px;
text-align:center;
border-bottom:1px solid #E5E7EB;

}

.sidebar-header img{

width:75px;
height:75px;
border-radius:50%;
margin-bottom:12px;

}

.sidebar-header h2{

font-size:22px;
color:var(--primary);

}

.sidebar-header p{

font-size:14px;
color:var(--grey);

}

/*=========================
SEARCH
=========================*/

.search-box{

padding:15px;
position:relative;

}

.search-box input{

width:100%;
padding:14px 45px 14px 15px;
border-radius:15px;
border:1px solid #E5E7EB;
outline:none;

}

.search-box i{

position:absolute;
right:30px;
top:50%;
transform:translateY(-50%);
color:var(--grey);

}

/*=========================
CUSTOMER LIST
=========================*/

.customer-list{

flex:1;
overflow-y:auto;

}

.customer-item{

display:flex;
align-items:center;
gap:12px;

padding:15px;

cursor:pointer;

border-bottom:1px solid #F1F5F9;

transition:.3s;

}

.customer-item:hover{

background:#EEF6FF;

}

.customer-item img{

width:50px;
height:50px;
border-radius:50%;

}

.customer-info{

flex:1;

}

.customer-info h4{

font-size:16px;

}

.customer-info p{

font-size:13px;
color:var(--grey);

}
/*======================================
CHAT AREA
======================================*/

.chat-area{

display:flex;
flex-direction:column;
height:100vh;
background:#F8FAFC;

}

.chat-topbar{

display:flex;
justify-content:space-between;
align-items:center;

padding:18px 25px;

background:#fff;

border-bottom:1px solid #E5E7EB;

}

.chat-messages{

flex:1;

overflow-y:auto;

padding:20px;

display:flex;
flex-direction:column;

gap:15px;

}

.message{

display:flex;

max-width:75%;

animation:fadeIn .25s ease;

}

.message.user{

align-self:flex-start;

}

.message.admin{

align-self:flex-end;

}

.bubble{

padding:14px 18px;

border-radius:18px;

font-size:14px;

line-height:1.6;

word-break:break-word;

box-shadow:var(--shadow);

}

.message.user .bubble{

background:#fff;

color:var(--text);

border-top-left-radius:5px;

}

.message.admin .bubble{

background:linear-gradient(135deg,#0D6EFD,#38BDF8);

color:#fff;

border-top-right-radius:5px;

}

.time{

margin-top:5px;

font-size:11px;

opacity:.7;

}

/*======================================
INPUT
======================================*/

.chat-input{

display:flex;

align-items:center;

gap:10px;

padding:15px;

background:#fff;

border-top:1px solid #E5E7EB;

}

.chat-input input[type="text"]{

flex:1;

padding:14px 18px;

border:1px solid #E5E7EB;

border-radius:25px;

outline:none;

font-size:15px;

}

.icon-btn,
.send-btn{

width:46px;

height:46px;

border:none;

border-radius:50%;

cursor:pointer;

display:flex;

justify-content:center;

align-items:center;

font-size:18px;

transition:.3s;

}

.icon-btn{

background:#EEF4FF;

color:var(--primary);

}

.send-btn{

background:linear-gradient(135deg,#0D6EFD,#38BDF8);

color:#fff;

}

.icon-btn:hover,
.send-btn:hover{

transform:scale(1.08);

}

/*======================================
EMOJI PANEL
======================================*/

.emoji-panel{

display:flex;

flex-wrap:wrap;

gap:10px;

padding:15px;

background:#fff;

border-top:1px solid #E5E7EB;

}

.emoji{

width:42px;

height:42px;

border:none;

border-radius:12px;

background:#F1F5F9;

cursor:pointer;

font-size:22px;

transition:.3s;

}

.emoji:hover{

background:#E2E8F0;

}

/*======================================
WELCOME
======================================*/

.welcome-chat{

margin:auto;

text-align:center;

color:#64748B;

}

.welcome-chat i{

font-size:70px;

margin-bottom:15px;

color:#0D6EFD;

}

.welcome-chat h3{

margin-bottom:10px;

}

/*======================================
ANIMATION
======================================*/

@keyframes fadeIn{

from{

opacity:0;

transform:translateY(12px);

}

to{

opacity:1;

transform:translateY(0);

}

}

/*======================================
RESPONSIVE
======================================*/

@media(max-width:900px){

.chat-layout{

grid-template-columns:1fr;

}

.sidebar{

display:none;

}

}

@media(max-width:480px){

.chat-topbar{

padding:15px;

}

.chat-input{

padding:10px;

}

.chat-input input{

font-size:14px;

}

.message{

max-width:90%;

}

}

/*======================================
DARK MODE
======================================*/

body.dark{

background:#0F172A;

}

body.dark .sidebar,
body.dark .chat-topbar,
body.dark .chat-input,
body.dark .emoji-panel{

background:#1E293B;

}

body.dark .chat-area{

background:#0F172A;

}

body.dark .bubble{

color:#fff;

}

body.dark .message.user .bubble{

background:#334155;

}

body.dark input{

background:#334155;

color:#fff;

border-color:#475569;

}

/*======================================
SCROLLBAR
======================================*/

.chat-messages::-webkit-scrollbar,
.customer-list::-webkit-scrollbar{

width:6px;

}

.chat-messages::-webkit-scrollbar-thumb,
.customer-list::-webkit-scrollbar-thumb{

background:#0D6EFD;

border-radius:20px;

}</script>
